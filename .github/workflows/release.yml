name: release — PROD deploy + migrate (tag v* → approval gate)

# Triển khai PRODUCTION khi push tag v*.*.* — run DỪNG chờ duyệt tại environment "production"
# (Settings → Environments → production → Required reviewers = thiemcun169).
# Repo PUBLIC → required-reviewers khả dụng trên gói Free → cổng duyệt NATIVE của GitHub.
# Prod chỉ deploy sau khi reviewer bấm "Approve and deploy".

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:   # chạy tay khi cần (vẫn đi qua cổng duyệt production)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production   # CỔNG DUYỆT: run pause chờ Required reviewers approve
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Migrate PROD Supabase
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_REF }} --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          supabase db push --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Vercel build Python (FastAPI) cần `uv` để cài deps khi build CỤC BỘ trên runner.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$HOME/.uv-bin" sh
          echo "$HOME/.uv-bin" >> "$GITHUB_PATH"
      - name: Deploy PROD Vercel
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
