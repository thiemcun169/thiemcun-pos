name: release — PROD deploy + migrate (manual, gated)

# Triển khai PRODUCTION = bước CÓ KIỂM SOÁT của người chủ.
#
# Cổng duyệt (gate) ở repo PRIVATE phụ thuộc gói GitHub:
#   * Gói Pro/Team/Enterprise (hoặc repo public): bật "Required reviewers" ở
#     Settings → Environments → production → run sẽ DỪNG chờ duyệt. (environment: production bên dưới)
#   * Gói Free + repo private: KHÔNG có required-reviewers → ta dùng cổng phần mềm:
#     chỉ chạy bằng tay (workflow_dispatch) VÀ phải gõ đúng "DEPLOY-PROD".
#
# => Prod KHÔNG bao giờ tự động chạy khi push/tag. Phải là hành động thủ công + xác nhận.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác DEPLOY-PROD để xác nhận triển khai PRODUCTION'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production   # bật Required reviewers ở đây khi nâng Pro/public để có gate native
    if: ${{ github.event.inputs.confirm == 'DEPLOY-PROD' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Migrate PROD Supabase
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_REF }} --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          supabase db push --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Vercel build Python (FastAPI) cần `uv` để cài deps khi build CỤC BỘ trên runner.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$HOME/.uv-bin" sh
          echo "$HOME/.uv-bin" >> "$GITHUB_PATH"
      - name: Deploy PROD Vercel
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
