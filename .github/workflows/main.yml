name: main — CI (test only, no auto-deploy)
# main KHÔNG tự deploy. Prod chỉ qua tag v* (release.yml, có cổng duyệt).
# Đây là lớp phòng thủ: mọi commit chạm main phải xanh test.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt && python -m pytest -q
