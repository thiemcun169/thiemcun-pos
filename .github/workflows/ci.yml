name: CI — test gate

# Chạy bộ test trên mỗi Pull Request + push lên main.
# Đặt job này làm "required check" (Settings -> Branches) để test ĐỎ thì KHÔNG cho merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint build + Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend: cài deps + build (bắt lỗi biên dịch) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build

      # ---------- Backend: pytest (unit + integration) ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
